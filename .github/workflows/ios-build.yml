name: Build iOS IPA

# Builds an unsigned .ipa for sideloading (see docs/ios-sideloading.md). It never deploys
# anything: the sideloading tool signs the file with an Apple ID at install time.
# Runs when the native wrapper changes. Web-only changes don't need a new IPA, because
# the app loads the live site.
on:
  workflow_dispatch:
  push:
    paths:
      - ios/**
      - ios-shell/**
      - capacitor.config.json
      - package-lock.json
      - .github/workflows/ios-build.yml

jobs:
  build-ipa:
    name: Build unsigned IPA
    # Capacitor 8 needs Xcode 26
    runs-on: macos-26

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync the Capacitor config and plugins into the Xcode project
        run: npx cap sync ios

      - name: Build the app without signing
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package the IPA
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/App.app Payload/
          zip -qry CalorieTracker.ipa Payload

      - name: Check the IPA contents
        run: |
          APP=Payload/App.app
          test -x "$APP/App"
          test -f "$APP/public/offline.html"
          grep -q 'https://health.villa-dev.com' "$APP/capacitor.config.json"
          /usr/libexec/PlistBuddy -c 'Print :NSCameraUsageDescription' "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist"
          lipo -archs "$APP/App" | grep -q arm64
          # A framework the app links but doesn't include would crash it on launch
          otool -L "$APP/App" | awk '/@rpath\/.*\.framework/ {print $1}' | sed 's#@rpath/#Frameworks/#' |
            while read -r framework; do
              echo "Checking $framework"
              test -f "$APP/$framework"
            done
          ls -lh CalorieTracker.ipa

      - name: Upload the IPA
        uses: actions/upload-artifact@v4
        with:
          name: CalorieTracker-ipa
          path: CalorieTracker.ipa
          if-no-files-found: error
